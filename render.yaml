services:
  - type: worker
    name: cronjob-scheduler
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm run scheduler
    envVars:
      - key: MONGODB_URI
        sync: false
      - key: NODE_ENV
        value: production
      - key: SCHEDULER_POLL_INTERVAL_MS
        value: "10000"
      - key: SCHEDULER_HEARTBEAT_INTERVAL_MS
        value: "30000"
      - key: SCHEDULER_MAX_CONCURRENT_JOBS
        value: "5"
      - key: SCHEDULER_LOCK_EXPIRY_MS
        value: "900000"
      - key: SCHEDULER_MAX_CATCHUP_JOBS
        value: "50"
      - key: HEADER_ENCRYPTION_KEY
        sync: false
      - key: RATELIMIT_SECRET
        sync: false
      - key: NEXTAUTH_SECRET
        sync: false
      - key: NEXTAUTH_URL
        sync: false
      - key: NEXT_PUBLIC_APP_URL
        sync: false
      - key: CRON_MIN_INTERVAL_MS
        value: "1000"
      - key: CSRF_SECRET
        sync: false
      - key: TRUSTED_PROXY
        value: "true"
      - key: DEBUG
        value: "false"
      - key: SCHEDULER_HEALTH_ENABLED
        value: "false"