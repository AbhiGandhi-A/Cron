services:
  # Free-tier WEB SERVICE hosting the scheduler. This lets Render route inbound
  # HTTPS traffic to the process (required so the service can be woken), and the
  # same long-running Node process both (1) runs the MongoDB scheduler loop and
  # (2) serves minimal /health + /wake HTTP so an EXTERNAL scheduler (EasyCron)
  # can send a keep-alive/wake request ~every 10 minutes.
  #
  # The EasyCron request ONLY wakes/keeps the service alive. It never executes
  # jobs — the scheduler itself polls MongoDB and decides what is due (incl.
  # missed jobs after a sleep period). Sleep/wake + catch-up cap logic is in
  # scheduler/scheduler.ts.
  - type: web
    name: cronjob-scheduler
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm run scheduler
    healthCheckPath: /health
    envVars:
      - key: MONGODB_URI
        sync: false
      - key: NODE_ENV
        value: production
      - key: SCHEDULER_POLL_INTERVAL_MS
        value: "10000"
      - key: SCHEDULER_HEARTBEAT_INTERVAL_MS
        value: "30000"
      - key: SCHEDULER_MAX_CONCURRENT_JOBS
        value: "5"
      - key: SCHEDULER_LOCK_EXPIRY_MS
        value: "900000"
      - key: SCHEDULER_MAX_CATCHUP_JOBS
        value: "50"
      - key: HEADER_ENCRYPTION_KEY
        sync: false
      - key: RATELIMIT_SECRET
        sync: false
      - key: NEXTAUTH_SECRET
        sync: false
      - key: NEXTAUTH_URL
        sync: false
      - key: NEXT_PUBLIC_APP_URL
        sync: false
      - key: CRON_MIN_INTERVAL_MS
        value: "1000"
      - key: CSRF_SECRET
        sync: false
      - key: TRUSTED_PROXY
        value: "true"
      - key: DEBUG
        value: "false"
      # The HTTP server is also auto-enabled because Render sets RENDER=true;
      # this is kept explicit for clarity.
      - key: SCHEDULER_HEALTH_ENABLED
        value: "true"